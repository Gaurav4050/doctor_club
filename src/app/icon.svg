<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <path id="favTopPath" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
    <path id="favBottomPath" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="97" fill="#0B2545" stroke="#F59E0B" stroke-width="4" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Inner White Field -->
  <circle cx="100" cy="100" r="58" fill="#F8FAFC" stroke="#F59E0B" stroke-width="4" />

  <!-- Circular Text -->
  <text fill="#FDE68A" font-size="14" font-weight="900" letter-spacing="4" text-anchor="middle" font-family="sans-serif">
    <textPath href="#favTopPath" startOffset="50%">ALL INDIA</textPath>
  </text>
  <text fill="#FDE68A" font-size="13" font-weight="900" letter-spacing="3" text-anchor="middle" font-family="sans-serif">
    <textPath href="#favBottomPath" startOffset="50%">DOCTORS CLUB</textPath>
  </text>

  <!-- Caduceus Wings & Rod -->
  <g transform="translate(100, 64) scale(0.7)">
    <path d="M 0 -18 L 0 38" stroke="#081B38" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="-20" r="5" fill="#F59E0B" />
    <path d="M 0 -14 C -16 -28 -34 -18 -40 -6 C -34 0 -20 -4 0 -10 C 20 -4 34 0 40 -6 C 34 -18 16 -28 0 -14 Z" fill="#081B38" />
  </g>

  <!-- Doctors Silhouettes -->
  <g transform="translate(100, 102) scale(0.72)">
    <circle cx="-28" cy="-18" r="8" fill="#081B38" />
    <path d="M -40 8 C -40 -6 -16 -6 -16 8 Z" fill="#081B38" />

    <circle cx="28" cy="-18" r="8" fill="#081B38" />
    <path d="M 16 8 C 16 -6 40 -6 40 8 Z" fill="#081B38" />

    <circle cx="0" cy="-22" r="10" fill="#081B38" />
    <path d="M -20 12 C -20 -8 20 -8 20 12 Z" fill="#081B38" />
  </g>

  <!-- Cross Badge -->
  <circle cx="100" cy="126" r="11" fill="#0B2545" stroke="#F59E0B" stroke-width="2" />
  <rect x="98" y="120" width="4" height="12" fill="#FFFFFF" rx="1" />
  <rect x="94" y="124" width="12" height="4" fill="#FFFFFF" rx="1" />
</svg>
